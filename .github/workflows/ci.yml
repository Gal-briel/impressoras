name: CI Workflow

on:
  push:
    branches:
      - sprint-26-release-candidate
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Documentação: Utilizando Python 3.13 como a versão mais recente
          # suportada nativamente de forma estável no GitHub Actions.
          # A versão 3.14 (usada localmente) pode ainda não estar garantida no runner oficial.
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Check All Script
        run: ./scripts/check-all.sh
